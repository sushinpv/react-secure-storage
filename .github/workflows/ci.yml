name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit + SSR tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build library and run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  package:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack (runs the prepack build)
        run: |
          mkdir -p .pack
          npm pack --pack-destination .pack
      - name: Verify package contents
        run: |
          tar -tzf .pack/*.tgz | sort | tee contents.txt
          for f in package/dist/index.js package/dist/types.d.ts package/package.json package/LICENSE; do
            grep -qx "$f" contents.txt || { echo "::error::missing $f in package"; exit 1; }
          done
          if grep -E '\.env|^package/src/' contents.txt; then echo "::error::unexpected files in package"; exit 1; fi
      - name: Size budget
        run: npm run size

  e2e:
    name: E2E (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    needs: [test, package]
    strategy:
      fail-fast: false
      matrix:
        fixture: [next, vite, react-router]
    env:
      E2E_FIXTURES: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/fixtures/${{ matrix.fixture }}/package-lock.json
      - run: npm ci
      - name: Pack library, install it into the fixture app, build the app
        run: node scripts/setup-e2e.mjs ${{ matrix.fixture }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.fixture == 'vite' && 'chromium firefox webkit' || 'chromium' }}
      - name: Run Playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.fixture }}
          path: |
            playwright-report/
            test-results/
