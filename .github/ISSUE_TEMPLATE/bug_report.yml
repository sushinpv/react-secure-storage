name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: react-secure-storage version
      placeholder: 1.3.3
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options: [Next.js App Router, Next.js Pages Router, Vite, Create React App, React Router / Remix, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / Node.js version
      placeholder: Chrome 140, Node 22
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code snippet or a link to a repository. Never include real hash keys or user data.
      render: tsx
    validations:
      required: true
